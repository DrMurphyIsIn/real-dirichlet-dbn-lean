# Cold reproduction of the chain on a GitHub-hosted Linux runner: check the md5 manifests, materialize openai/math
# at the pin with this repository's modules inside it (and re-derive the island modules from their source), build
# the 29 chain modules and the negative control, print and grep the axioms of both conjuncts, check that the
# headline statements print identically with and without OpenAI in scope, and REQUIRE the tampered statements
# to be rejected. Several CPU-hours cold; the build is checkpointed between runs.
#
# This workflow has not been run yet. The five-checker replay and the sandboxed Comparator run are not part of it
# (the export alone is 1.7 GB); a Comparator step against challenge/ will be added after the sandboxed run.
name: verify
# Manual-only until its first run passes; the push trigger is restored after that.
on:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    defaults: { run: { shell: bash } }
    env:
      ELAN_TOOLCHAIN: leanprover/lean4:v4.34.1
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL || true
          df -h / | tail -1
      - name: Check the md5 manifests
        run: scripts/verify_md5.sh
      - name: Install elan
        run: |
          curl -sSfL https://github.com/leanprover/elan/releases/latest/download/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Materialize openai/math at the pin and check the island provenance
        run: scripts/materialize.sh --check-island
      - name: Cache key
        id: ckey
        run: echo "prefix=rddbn-$(sha256sum lean/OAI_PIN lean/lakefile-stanza.lean | sha256sum | cut -c1-16)-" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        with:
          path: work/oai/.lake
          key: ${{ steps.ckey.outputs.prefix }}${{ github.run_id }}
          restore-keys: ${{ steps.ckey.outputs.prefix }}
      - name: Resolve OpenAI's dependencies (their lakefile applies their 23 patches) and fetch Mathlib oleans
        working-directory: work/oai
        run: |
          lake update
          ../../scripts/check_manifest.sh   # lake update can rewrite the manifest; it must still be OpenAI's pin
          lake exe cache get
          grep -q '"rev": "d13f23b723b8a846827a245b89c10fc7d3f11612"' lake-manifest.json
      - name: Build the chain and the negative control
        id: build
        working-directory: work/oai
        run: lake build RDDBNIsland RDDBNGen RDDBNGauss RDDBNMain RDDBNNegativeControl
      - name: Save build checkpoint
        if: always() && steps.build.outcome != 'skipped'
        uses: actions/cache/save@v4
        with:
          path: work/oai/.lake
          key: ${{ steps.ckey.outputs.prefix }}${{ github.run_id }}
      - name: Axioms of both conjuncts
        working-directory: work/oai
        run: |
          set -euo pipefail
          lake env lean BbOaiMeaningCheck.lean | tee cmp_BbOaiMeaningCheck.out
          lake env lean BbOaiRealPrimCheck.lean | tee cmp_BbOaiRealPrimCheck.out
          ! grep -q sorryAx cmp_BbOaiMeaningCheck.out cmp_BbOaiRealPrimCheck.out
          grep -q "'bb_real_primitive_meaning_oai' depends on axioms: \[propext, Classical.choice, Quot.sound\]" cmp_BbOaiMeaningCheck.out
          grep -q "'DBN.Gen.Hchi_bridge' depends on axioms: \[propext, Classical.choice, Quot.sound\]" cmp_BbOaiMeaningCheck.out
          grep -q "'bb_real_primitive_real_zeros_oai' depends on axioms: \[propext, Classical.choice, Quot.sound\]" cmp_BbOaiRealPrimCheck.out
          grep -q "'DBN.Gen.rootNumber_eq_one_of_real_primitive' depends on axioms: \[propext, Classical.choice, Quot.sound\]" cmp_BbOaiRealPrimCheck.out
          [ "$(grep -c 'agree = true' cmp_BbOaiMeaningCheck.out)" = 2 ]
          [ "$(grep -c 'agree = true' cmp_BbOaiRealPrimCheck.out)" = 1 ]
      - name: Statement identity with and without OpenAI in scope
        working-directory: work/oai
        run: |
          set -euo pipefail
          for p in BbOaiMeaning BbOaiRealPrim; do
            lake env lean ${p}Ref.lean > cmp_${p}Ref.out
            n=$(wc -c < cmp_${p}Ref.out)
            tail -c "$n" cmp_${p}Check.out | cmp - cmp_${p}Ref.out
            echo "$p: pp.all statement identical with and without OpenAI ($n bytes)"
            cmp -s cmp_${p}Ref.out "$GITHUB_WORKSPACE/logs/oai_env/${p}Ref.out" \
              && echo "$p: identical to the auditor's recorded output" \
              || echo "::warning::$p: pp.all text differs from logs/oai_env/${p}Ref.out"
          done
      - name: Tampered statements must be rejected
        working-directory: work/oai
        run: |
          set -uo pipefail; fail=0
          for t in "BbOaiMeaningTamper 3" "BbOaiRealPrimTamper 2"; do
            set -- $t
            if lake env lean "$1.lean" > "cmp_$1.out" 2>&1; then echo "::error::$1 compiled: a tamper was ACCEPTED"; fail=1; fi
            k=$(grep -c ': error' "cmp_$1.out")
            if [ "$k" = "$2" ]; then echo "REJECTED as required: $1 ($k errors)"; else echo "::error::$1: expected $2 errors, got $k"; cat "cmp_$1.out"; fail=1; fi
          done
          exit $fail
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: verify-logs, path: "work/oai/cmp_*.out", if-no-files-found: ignore }
